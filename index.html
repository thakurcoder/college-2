<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            background: #4CAF50;
            color: white;
            padding: 15px 0;
        }
        button {
            padding: 10px 20px;
            margin-top: 20px;
            border: none;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #45a049;
        }
        #message {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to HTML Demo</h1>
</header>

<main>
    <p>This is a simple interactive HTML page.</p>
    <button onclick="showMessage()">Click Me</button>
    <div id="message"></div>
</main>

<script>
    function showMessage() {
        document.getElementById("message").innerText = "Hello! You clicked the button 🎉";
    }
</script>

</body>
</html>
